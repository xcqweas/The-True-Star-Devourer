<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><title>Massive planet progression checks</title>
  <link rel="stylesheet" href="../style.css">
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.12/lib/p5.js"></script>
  <style>
    #checks{position:fixed;right:12px;bottom:12px;max-width:min(360px,90vw);padding:12px;
      background:#091320ed;color:#dbe8f5;border:1px solid #35506a;border-radius:8px;font:12px/1.5 sans-serif}
    button{margin:2px;padding:5px}output{display:block;color:#a5d9ed}p{margin:6px 0}
  </style>
</head>
<body>
  <aside id="checks"><details><summary>Massive planet checks · test page</summary>
    <p>Real steering, collision, escape and shard collection. Alternating 6.4M targets.
      Rims retain physical-size colors; feeding uses mass. Normal difficulty.</p>
    <button onclick="showChoice()">Evolution choice</button>
    <button onclick="replay('massiveSolid')">Solid raid</button>
    <button onclick="replay('gasGiant')">Gas raid</button><br>
    <button onclick="playToEnding()">Play to ending</button>
    <button onclick="paused=!paused">Pause / resume</button>
    <button onclick="automatic=false;paused=false">Mouse control</button>
    <output id="status"></output>
  </details></aside>
  <script src="../js/constants.js"></script>
  <script src="../js/game-state.js"></script>
  <script src="../js/camera.js"></script>
  <script src="../js/growth.js"></script>
  <script src="../js/bodies.js"></script>
  <script src="../js/stage-visuals.js"></script>
  <script src="../js/gravity.js"></script>
  <script src="../js/world.js"></script>
  <script src="../js/collisions.js"></script>
  <script src="../js/ecology.js"></script>
  <script src="../js/hazards.js"></script>
  <script src="../js/movement-visuals.js"></script>
  <script src="../js/spawn-and-init.js"></script>
  <script src="../js/screens.js"></script>
  <script src="../js/gameplay.js"></script>
  <script src="../js/p5-entry.js"></script>
  <script src="massive-stage-scenarios.js"></script>
  <script>
    let route=null,paused=false,automatic=false,keepGoing=false;
    const realSetup=setup,realUpdate=updateGame,realDraw=draw;
    setup=()=>{realSetup();showChoice();};
    updateGame=()=>{
      if(route&&automatic)steerMassiveStageScenario(route);
      realUpdate();
      if(route){
        observeMassiveStageScenario(route);
        if(route.phase==='recovered'){
          if(keepGoing)addMassiveStageEncounter(route);else paused=true;
        }
      }
    };
    draw=()=>{
      if(paused&&gameState==='playing'){background(30);updateCamera(deltaTime/1000);drawGame();}
      else realDraw();
      document.getElementById('checks').style.display=gameState==='evolving'?'none':'';
      document.getElementById('status').textContent=gameState+' · '+playerFormLabel()+
        ' · mass '+formatMass(player.mass)+' · r '+player.r.toFixed(1)+' · zoom '+camera.zoom.toFixed(4)+
        (route?' · '+route.phase+' · '+route.encounters+' encounters · '+route.impactCount+' impacts'+
          ' · '+route.elapsed.toFixed(1)+'s · mass error '+route.massError.toExponential(1):'');
    };
    function replay(branch){route=loadMassiveStageScenario(branch);automatic=true;paused=true;keepGoing=false;}
    function playToEnding(){
      if(!route){
        if(!MASSIVE_PLANET_BRANCHES[player.type])return;
        route=loadMassiveStageScenario(player.type);
      }
      automatic=true;paused=false;keepGoing=true;
    }
    function showChoice(){
      startGame({seed:94851,fixture:true});world=createWorld(runSeed,0,1,true);
      world.regions.clear();world.sourceRegions.clear();syncWorldRegions();syncEcology(true);
      gameState='playing';setBodyMass(player,MASSIVE_PLANET_STAGE.mass);updatePlayerEvolution();resetCamera();
      route=null;paused=false;automatic=false;
    }
  </script>
</body>
</html>
